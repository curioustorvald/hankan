# Cloudflare Worker with static assets only (no Worker script).
# `wrangler deploy` runs the build below first: webpage-worker/public is
# gitignored, so a fresh checkout has nothing to upload until it is built.
name = "hankan"
compatibility_date = "2026-09-01"

[build]
command = "npm run build:web"
watch_dir = ["webpage-worker/src", "engine/src"]

[assets]
directory = "./webpage-worker/public"
